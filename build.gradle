plugins {
	id 'groovy'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.reqly'
version = '1.0.0'
description = 'Reqly — Lightweight API Testing Tool'

java {
	sourceCompatibility = '17'
	targetCompatibility = '17'
}

tasks.withType(JavaCompile) {
	options.compilerArgs << '-parameters'
}

tasks.withType(GroovyCompile).configureEach {
	groovyOptions.parameters = true
	groovyOptions.optimizationOptions.indy = true
	options.compilerArgs << '-parameters'
}

repositories {
	mavenCentral()
}

dependencies {

	// Web + REST
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Password hashing (BCrypt) for local accounts
	implementation 'org.springframework.security:spring-security-crypto'

	// Versioned schema migrations
	implementation 'org.flywaydb:flyway-core'

	// JPA / Hibernate
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Database
	implementation 'org.mariadb.jdbc:mariadb-java-client:3.3.3'
	runtimeOnly 'com.h2database:h2'

	// Groovy
	implementation 'org.apache.groovy:groovy:4.0.23'
	implementation 'org.apache.groovy:groovy-json:4.0.23'

	// Jackson
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.16.1'

	// CSV parsing
	implementation 'com.opencsv:opencsv:5.9'

	// HTTP client
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'

	// Tests
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// During `./gradlew bootRun`, serve the UI straight from src/ so HTML/CSS/JS edits show up on a page reload
tasks.named('bootRun') {
	systemProperty 'spring.web.resources.static-locations', "file:${projectDir}/src/main/resources/static/,classpath:/static/"
	systemProperty 'spring.web.resources.cache.period', '0'
	systemProperty 'spring.thymeleaf.prefix', "file:${projectDir}/src/main/resources/templates/"
	systemProperty 'spring.thymeleaf.cache', 'false'
}

// ---------------------------------------------------------------------------
// Desktop packaging (jpackage, bundles its own Java runtime)
//   ./gradlew packageMacApp   -> build/dist/Reqly.app   (quick local test)
//   ./gradlew packageMac      -> build/dist/Reqly-1.0.0.dmg
// Signing/notarisation: pass -PmacSignIdentity="Developer ID Application: Name (TEAMID)"
// ---------------------------------------------------------------------------
def jpackageInput = layout.buildDirectory.dir('jpackage/input')
def distDir = layout.buildDirectory.dir('dist')

tasks.register('prepareJpackageInput', Sync) {
	dependsOn 'bootJar'
	from tasks.named('bootJar')
	into jpackageInput
}

[packageMacApp: 'app-image', packageMac: 'dmg'].each { taskName, type ->
	tasks.register(taskName, Exec) {
		group = 'distribution'
		description = "Builds the macOS ${type} with jpackage"
		dependsOn 'prepareJpackageInput'
		doFirst {
			def dest = distDir.get().asFile
			dest.mkdirs()
			delete(new File(dest, 'Reqly.app'))
			delete(fileTree(dest) { include '*.dmg' })
		}
		def cmd = ['jpackage', '--type', type,
			'--name', 'Reqly',
			'--app-version', project.version,
			'--vendor', 'Reqly',
			'--description', 'The API client that stays on your machine.',
			'--copyright', '© [Company Name]',
			'--input', jpackageInput.get().asFile.path,
			'--main-jar', "reqly-${project.version}.jar".toString(),
			'--icon', file('packaging/macos/Reqly.icns').path,
			'--java-options', '-Dreqly.desktop=true',
			'--java-options', '-Xmx768m',
			'--mac-package-identifier', 'com.reqly.app',
			'--mac-package-name', 'Reqly',
			'--mac-app-category', 'developer-tools', // jpackage adds the public.app-category. prefix
			'--dest', distDir.get().asFile.path]
		if (project.hasProperty('macSignIdentity')) cmd += ['--mac-sign', '--mac-signing-key-user-name', project.property('macSignIdentity')]
		commandLine cmd
	}
}
