plugins {
	id 'groovy'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.reqly'
version = '1.0.0'
description = 'Reqly — Lightweight API Testing Tool'

java {
	sourceCompatibility = '17'
	targetCompatibility = '17'
}

tasks.withType(JavaCompile) {
	options.compilerArgs << '-parameters'
}

tasks.withType(GroovyCompile).configureEach {
	groovyOptions.parameters = true
	groovyOptions.optimizationOptions.indy = true
	options.compilerArgs << '-parameters'
}

repositories {
	mavenCentral()
}

dependencies {

	// Web + REST
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Password hashing (BCrypt) for local accounts
	implementation 'org.springframework.security:spring-security-crypto'

	// Versioned schema migrations
	implementation 'org.flywaydb:flyway-core'

	// JPA / Hibernate
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Database
	implementation 'org.mariadb.jdbc:mariadb-java-client:3.3.3'
	runtimeOnly 'com.h2database:h2'

	// Groovy
	implementation 'org.apache.groovy:groovy:4.0.23'
	implementation 'org.apache.groovy:groovy-json:4.0.23'

	// Jackson
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.16.1'

	// CSV parsing
	implementation 'com.opencsv:opencsv:5.9'

	// HTTP client
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'

	// Tests
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// During `./gradlew bootRun`, serve the UI straight from src/ so HTML/CSS/JS edits show up on a page reload
tasks.named('bootRun') {
	systemProperty 'spring.web.resources.static-locations', "file:${projectDir}/src/main/resources/static/,classpath:/static/"
	systemProperty 'spring.web.resources.cache.period', '0'
	systemProperty 'spring.thymeleaf.prefix', "file:${projectDir}/src/main/resources/templates/"
	systemProperty 'spring.thymeleaf.cache', 'false'
}

// ---------------------------------------------------------------------------
// Desktop packaging (jpackage, bundles its own Java runtime)
//   ./gradlew packageMacApp   -> build/dist/Reqly.app   (quick local test)
//   ./gradlew packageMac      -> build/dist/Reqly-1.0.0.dmg
// Reqly.app's executable is the native shell (packaging/macos/shell/main.swift): it starts the bundled
// server and shows Reqly in its own window, so nothing opens in a browser.
// Signing/notarisation: pass -PmacSignIdentity="Developer ID Application: Name (TEAMID)"
// ---------------------------------------------------------------------------
def jpackageInput = layout.buildDirectory.dir('jpackage/input')
def distDir = layout.buildDirectory.dir('dist')
def shellBinary = layout.buildDirectory.file('macshell/Reqly')
def signIdentity = project.findProperty('macSignIdentity')

tasks.register('prepareJpackageInput', Sync) {
	dependsOn 'bootJar'
	from tasks.named('bootJar')
	into jpackageInput
}

tasks.register('compileMacShell', Exec) {
	group = 'distribution'
	description = 'Compiles the native macOS window that hosts Reqly'
	def source = file('packaging/macos/shell/main.swift')
	inputs.file(source)
	outputs.file(shellBinary)
	def arch = System.getProperty('os.arch') == 'aarch64' ? 'arm64' : 'x86_64' // match the bundled Java runtime
	doFirst { shellBinary.get().asFile.parentFile.mkdirs() }
	commandLine 'xcrun', 'swiftc', '-O', '-target', "${arch}-apple-macos12".toString(),
		'-o', shellBinary.get().asFile.path, source.path
}

tasks.register('packageMacApp', Exec) {
	group = 'distribution'
	description = 'Builds build/dist/Reqly.app (native window + bundled server)'
	dependsOn 'prepareJpackageInput', 'compileMacShell'
	def app = distDir.map { new File(it.asFile, 'Reqly.app') }
	doFirst {
		distDir.get().asFile.mkdirs()
		delete(app.get())
	}
	def cmd = ['jpackage', '--type', 'app-image',
		'--name', 'Reqly',
		'--app-version', project.version,
		'--vendor', 'Reqly',
		'--description', 'The API client that stays on your machine.',
		'--copyright', '© [Company Name]',
		'--input', jpackageInput.get().asFile.path,
		'--main-jar', "reqly-${project.version}.jar".toString(),
		'--icon', file('packaging/macos/Reqly.icns').path,
		'--java-options', '-Dreqly.desktop=true',
		'--java-options', '-Xmx768m',
		// jpackage's default also strips bin/java, which the shell needs to start the server
		'--jlink-options', '--strip-debug --no-man-pages --no-header-files',
		'--mac-package-identifier', 'com.reqly.app',
		'--mac-package-name', 'Reqly',
		'--mac-app-category', 'developer-tools', // jpackage adds the public.app-category. prefix
		'--dest', distDir.get().asFile.path]
	if (signIdentity) cmd += ['--mac-sign', '--mac-signing-key-user-name', signIdentity]
	commandLine cmd
	doLast {
		def contents = new File(app.get(), 'Contents')
		// Swap jpackage's launcher for the shell; the shell runs Contents/runtime's java on Contents/app's jar itself
		def exe = new File(contents, 'MacOS/Reqly')
		exe.bytes = shellBinary.get().asFile.bytes
		exe.setExecutable(true, false)
		def plist = new File(contents, 'Info.plist').path
		providers.exec { commandLine '/usr/libexec/PlistBuddy', '-c', 'Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true', plist; ignoreExitValue = true }.result.get()
		providers.exec { commandLine '/usr/libexec/PlistBuddy', '-c', 'Add :LSMinimumSystemVersion string 12.0', plist; ignoreExitValue = true }.result.get()
		// Changing the executable invalidates the bundle signature: sign again (ad hoc unless an identity was given)
		def sign = signIdentity
			? ['codesign', '--force', '--timestamp', '--options', 'runtime', '--entitlements', file('packaging/macos/shell/Reqly.entitlements').path, '--sign', signIdentity, app.get().path]
			: ['codesign', '--force', '--deep', '--sign', '-', app.get().path]
		providers.exec { commandLine sign }.result.get()
	}
}

tasks.register('packageMac', Exec) {
	group = 'distribution'
	description = 'Builds build/dist/Reqly-<version>.dmg from Reqly.app'
	dependsOn 'packageMacApp'
	doFirst { delete(fileTree(distDir) { include '*.dmg' }) }
	def cmd = ['jpackage', '--type', 'dmg',
		'--name', 'Reqly',
		'--app-version', project.version,
		'--app-image', distDir.get().file('Reqly.app').asFile.path,
		'--dest', distDir.get().asFile.path]
	if (signIdentity) cmd += ['--mac-sign', '--mac-signing-key-user-name', signIdentity]
	commandLine cmd
}
