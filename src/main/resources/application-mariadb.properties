# MariaDB profile — activate with: --spring.profiles.active=mariadb
spring.datasource.url=jdbc:mariadb://localhost:3306/reqly?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.h2.console.enabled=false

# Migrations are H2-only for now; on MariaDB Hibernate keeps the schema up to date
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
