spring.application.name=Reqly

# H2 embedded (default — zero config, data persists in ~/reqly-data)
spring.datasource.url=jdbc:h2:file:~/reqly-data/reqly;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE;FILE_LOCK=NO
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Schema is managed by Flyway (src/main/resources/db/migration/h2); Hibernate only checks it
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2
# Databases created before Flyway already have the V1 schema
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# H2 dialect auto-detected by Hibernate

# H2 web console stays off: it would expose the whole database to the browser
spring.h2.console.enabled=false

# Server: only reachable from this machine
server.address=127.0.0.1
server.port=8899
server.error.include-message=never
server.error.include-stacktrace=never

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
