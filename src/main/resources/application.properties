spring.application.name=Reqly

# H2 embedded (default — zero config, data persists in ~/reqly-data)
spring.datasource.url=jdbc:h2:file:~/reqly-data/reqly;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE;FILE_LOCK=NO
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# H2 dialect auto-detected by Hibernate

# H2 Console (dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Server
server.port=8899

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
